server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Reverse proxy para los endpoints REST del Backend .NET 8
    location /api/ {
        proxy_pass http://resonance_api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }

    # Reverse proxy con soporte WebSocket para SignalR (/hubs/room y /hubs/community)
    location /hubs/ {
        proxy_pass http://resonance_api:5000/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Healthcheck del nodo para el detector de Failover
    location = /health {
        proxy_pass http://resonance_api:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Reverse proxy para Subsonic / Navidrome en el host (:4533)
    location /rest/ {
        proxy_pass http://host.docker.internal:4533/rest/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Swagger OpenAPI
    location /swagger {
        proxy_pass http://resonance_api:5000/swagger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Enrutamiento SPA para las 3 páginas de React (/, /login, /home, /rooms/:code)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
